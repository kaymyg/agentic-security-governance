[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Reference implementation of governance controls for autonomous AI agents: scoped tokens, policy enforcement, circuit breakers, honey-tokens, tamper-evident audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kay", email = "kaymyg@users.noreply.github.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
